<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontier Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Colours come from the theme (applyTheme() derives every token from a background and an
           accent colour). These are the defaults until the page script runs. */
        :root {
            color-scheme: dark;
            --bg: #0f1513;
            --panel: rgba(20, 29, 27, 0.94);
            --surface: #182220;
            --surface-2: #1f2b28;
            --surface-3: #263431;
            --ink: #e3ebe8;
            --muted: #93a39d;
            --faint: #64736e;
            --line: #2b3834;
            --accent: #4fc79b;
            --accent-soft: #1b3a30;
            --accent-ink: #0f1513;
            --warn: #e6ad4c;
            --danger: #ef8a7e;

            --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
            --font-body: 'Barlow', 'Segoe UI', sans-serif;
            --r: 8px;
            --r-sm: 5px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.3 var(--font-body);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        button, input { font: inherit; color: inherit; }
        /* OBS view: transparent page, only the panels show */
        body.display { background: transparent; overflow: hidden; }
        .hidden { display: none !important; }

        #stage { transform-origin: top left; }

        /* ---------- Control bar ---------- */
        .bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            user-select: none;
        }
        .bar .spacer { flex: 1; min-width: 8px; align-self: stretch; cursor: grab; }

        .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px; }
        .seg button {
            border: 0; background: none; padding: 3px 9px; border-radius: 4px; cursor: pointer;
            font: 600 13px var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
        }
        .seg button.on { background: var(--accent); color: var(--accent-ink); }

        .icon-btn {
            border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm);
            min-width: 28px; height: 28px; padding: 0 8px; cursor: pointer; color: var(--muted);
            font: 600 13px var(--font-display); letter-spacing: .03em; text-transform: uppercase;
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
        }
        .icon-btn:hover { color: var(--ink); border-color: var(--faint); }
        .icon-btn.on { color: var(--accent); border-color: var(--accent); }
        .icon-btn svg { width: 14px; height: 14px; }

        .search { position: relative; }
        #trainerBox { flex: 0 1 200px; min-width: 110px; }
        .search input {
            width: 170px; height: 28px; padding: 0 9px; border-radius: var(--r-sm);
            border: 1px solid var(--line); background: var(--bg); outline: none;
        }
        .search input:focus { border-color: var(--accent); }
        #trainerBox input { width: 100%; }
        .bar .seg, .bar .icon-btn { flex: none; }
        .results {
            position: absolute; z-index: 20; top: 32px; left: 0; width: 280px; max-height: 280px; overflow-y: auto;
            margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--r-sm); box-shadow: 0 8px 24px rgba(0,0,0,.45);
        }
        .results li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
        .results li.active { background: var(--accent-soft); }
        .results .num { color: var(--muted); font-family: var(--font-display); }
        .results .none { color: var(--muted); cursor: default; }

        .stepper { display: inline-flex; align-items: center; gap: 4px; font: 600 13px var(--font-display); text-transform: uppercase; color: var(--muted); }
        .stepper b { color: var(--ink); min-width: 22px; text-align: center; font-size: 16px; }

        /* ---------- Header ---------- */
        .head {
            display: flex; align-items: baseline; gap: 10px; padding: 8px 12px 6px;
            font-family: var(--font-display);
        }
        .head .label { color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
        .head .name { font-size: 24px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
        .head .meta { margin-left: auto; color: var(--muted); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; text-align: right; }
        .head .meta b { color: var(--accent); font-weight: 600; }
        body.display .head { background: var(--panel); border-radius: var(--r); margin: 0 8px; }

        /* ---------- Picker ---------- */
        .picker { padding: 4px 10px 8px; border-bottom: 1px solid var(--line); }
        .picker-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .picker-top .hint { color: var(--faint); font-size: 12px; }
        .chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 132px; overflow-y: auto; }
        .chip {
            display: inline-flex; align-items: center; gap: 2px; padding: 0 8px 0 0; height: 32px;
            border: 1px solid var(--line); background: var(--surface); border-radius: 16px; cursor: pointer; font-size: 13px;
        }
        .chip img { width: 36px; height: 36px; margin: -2px -2px -2px 0; image-rendering: pixelated; }
        .chip .n { color: var(--faint); font: 600 12px var(--font-display); margin-left: 3px; }
        .chip:hover { border-color: var(--faint); }
        .chip.picked { border-color: var(--accent); background: var(--accent-soft); }
        .chip.active { outline: 2px solid var(--accent); outline-offset: 1px; }
        .picker .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

        /* ---------- Slots ---------- */
        .slots { display: flex; flex-direction: column; gap: 12px; padding: 10px 8px; }
        .slot {
            display: grid; grid-template-columns: 128px 1fr; gap: 10px; align-items: center;
            background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 8px;
            box-shadow: 0 2px 10px var(--shadow);
        }
        body.display .slot { background: var(--panel); }
        .slot.blank { display: flex; align-items: center; justify-content: center; min-height: 36px; color: var(--faint); border-style: dashed; background: none; font-size: 13px; }
        .mon { position: relative; text-align: center; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
        .mon img { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin: -8px auto -6px; }
        .mon .sp { font: 700 18px var(--font-display); letter-spacing: .02em; }
        .types { display: flex; justify-content: center; gap: 3px; margin: 2px 0 3px; }
        .type {
            font: 700 10px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: #fff;
            padding: 1px 6px; border-radius: 3px; text-shadow: 0 1px 1px rgba(0,0,0,.35);
        }
        .mon .x {
            position: absolute; top: -4px; right: -4px; border: 0; background: none; color: var(--faint);
            cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px;
        }
        .mon .x:hover { color: var(--danger); }
        body.display .mon .x { display: none; }

        .sets { display: grid; gap: 5px; }
        .set {
            background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm);
            padding: 5px; cursor: pointer; transition: opacity .12s, border-color .12s; min-width: 0;
        }
        .set:hover { border-color: var(--faint); }
        .set.possible { border-style: dashed; border-color: var(--faint); }
        .partial { margin: 6px auto 0; max-width: 112px; font-size: 11.5px; line-height: 1.3; color: var(--accent); }
        .set.locked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
        .set.out { opacity: .28; }
        .set.maybe { opacity: .62; }
        .set-top { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; font-family: var(--font-display); min-height: 26px; }
        .item-icon { width: 26px; height: 26px; flex: none; image-rendering: pixelated; margin: -2px -1px -2px -3px; }
        .unk-item { display: inline-grid; place-items: center; width: 20px; height: 20px; margin: 0 2px 0 0; border: 1px dashed var(--faint);
            border-radius: 50%; color: var(--faint); font: 600 12px var(--font-body); }
        .item-name { font: 500 11.5px var(--font-body); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
        .set-top .no { font-weight: 700; font-size: 17px; line-height: 1; }
        .set-top .ev { margin-left: auto; color: var(--muted); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
        .ev .sep { color: var(--faint); margin: 0 3px; font-weight: 500; }
        .st-hp { color: var(--ev-hp); } .st-atk { color: var(--ev-atk); } .st-def { color: var(--ev-def); }
        .st-spa { color: var(--ev-spa); } .st-spd { color: var(--ev-spd); } .st-spe { color: var(--ev-spe); }
        .set-sub { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; white-space: nowrap; overflow: hidden; }
        .set-sub span { overflow: hidden; text-overflow: ellipsis; }
        .set-sub .item { color: var(--ink); }
        .set-sub .ab { color: var(--warn); text-align: right; }
        .set-sub .iv { margin-left: auto; flex: none; color: var(--faint); }
        .unk { color: var(--faint); font-style: italic; }
        .moves { display: grid; gap: 3px; }
        .move {
            position: relative; display: block; width: 100%; text-align: left; border: 0; cursor: pointer;
            padding: 3px 7px; border-radius: 4px; font-size: 13px; font-weight: 600; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 1px rgba(0,0,0,.4);
        }
        .move.revealed { box-shadow: 0 0 0 2px #fff inset; }
        .move.revealed::after { content: '✓'; position: absolute; right: 6px; }
        .move.blank { background: none; border: 1px dashed var(--line); color: var(--faint); font-weight: 500; font-style: italic; cursor: default; text-shadow: none; }
        .set.ghost { cursor: default; display: flex; flex-direction: column; justify-content: center; text-align: center; min-height: 120px; color: var(--muted); font-size: 12.5px; border-style: dashed; background: none; }
        .set.ghost .no { font: 700 17px var(--font-display); color: var(--ink); margin-bottom: 4px; }

        .note { padding: 0 12px 8px; color: var(--faint); font-size: 11.5px; }
        body.display .note, body.display .foot { display: none; }
        .foot { display: flex; gap: 10px; padding: 0 12px 10px; color: var(--faint); font-size: 11.5px; }
        .foot .warn { color: var(--warn); }
        .update { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); }
        .status { padding: 24px; color: var(--muted); text-align: center; }

        /* ---------- Your team: same look as an opponent's row ---------- */
        .team {
            display: grid; gap: 8px; margin: 0 8px 10px; width: max-content; max-width: calc(100% - 16px);
            background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 8px;
            box-shadow: 0 2px 10px var(--shadow);
        }
        body.display .team { background: var(--panel); }
        .tm-controls { display: flex; align-items: center; gap: 8px; }
        .tm-hint { color: var(--muted); font: 600 12px var(--font-display); letter-spacing: .1em; text-transform: uppercase; }
        .tm-controls select { max-width: 120px; height: 26px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); padding: 0 4px; font: 600 13px var(--font-display); }
        .set.tm { cursor: default; }
        .set.tm.click { cursor: pointer; }
        .set.tm.click:hover { border-color: var(--accent); }
        .set.tm .set-top { min-height: 42px; margin-bottom: 2px; }
        .tm-sprite { position: relative; width: 44px; height: 42px; flex: none; margin: -4px -2px -4px -4px; }
        .tm-sprite img.mon-img { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; transform: translate(-50%, -50%); image-rendering: pixelated; }
        .tm-name { font-weight: 700; font-size: 16px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .set.tm .move { cursor: default; }
        .set.tm.empty { display: flex; align-items: center; justify-content: center; min-height: 140px; border-style: dashed; background: none; color: var(--faint); cursor: pointer; font-size: 13px; }
        .set.tm.empty:hover { color: var(--accent); border-color: var(--accent); }
        .team .empty-msg { color: var(--muted); font-size: 13px; padding: 6px 4px; }

        /* OBS: everything shrinks to fit its content instead of stretching across the source */
        body.display #stage { width: max-content; max-width: 100vw; }

        /* Dialogs (team editor, rental picker) */
        .dialog-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
        .dialog {
            width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); color: var(--ink);
            border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 16px 40px var(--shadow); padding: 14px; display: grid; gap: 12px;
        }
        .dialog h2 { margin: 0; font: 700 20px var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
        .dialog .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .dialog .grow { flex: 1; }
        .dialog input[type=text], .dialog textarea {
            width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 6px 8px; outline: none;
        }
        .dialog input[type=text]:focus, .dialog textarea:focus { border-color: var(--accent); }
        .dialog textarea { min-height: 260px; font: 12.5px/1.45 ui-monospace, 'Cascadia Mono', Consolas, monospace; resize: vertical; }
        .dialog .hint { color: var(--faint); font-size: 12px; line-height: 1.4; }
        .dialog .warn { color: var(--warn); font-size: 12px; }
        .editor { display: grid; grid-template-columns: 180px 1fr; gap: 12px; }
        .team-list { display: grid; gap: 4px; align-content: start; }
        .team-list button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 8px; cursor: pointer; }
        .team-list button.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
        .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); padding: 5px 12px; cursor: pointer; font: 600 13px var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
        .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
        .btn.danger { color: var(--danger); }
        .rental-list { display: grid; gap: 6px; }
        .rental { display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; align-items: center; text-align: left; padding: 6px 8px;
            border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); cursor: pointer; }
        .rental:hover { border-color: var(--accent); }
        .rental.other { opacity: .55; }
        .rental .no { font: 700 18px var(--font-display); text-align: center; grid-row: span 2; }
        .rental .line1 { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
        .rental .line1 .item-icon { width: 22px; height: 22px; margin: -3px 0; }
        .rental .line2 { font-size: 12.5px; }
        .chips.small .chip { height: 28px; }

        /* ---------- Theme panel ---------- */
        .theme-panel {
            position: absolute; z-index: 30; right: 8px; top: 44px; width: 300px; padding: 12px;
            background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r);
            box-shadow: 0 12px 32px var(--shadow); display: grid; gap: 12px;
        }
        .theme-panel h3 { margin: 0; font: 600 12px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
        .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .preset {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; text-align: left;
            border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); font-size: 13px;
        }
        .preset.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
        .preset .sw { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 1px solid rgba(127,127,127,.4); }
        .pick-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
        .pick-row input[type=color] { width: 44px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
        .pick-row input[type=range] { width: 130px; accent-color: var(--accent); }
        .pick-row .val { color: var(--muted); font-size: 12px; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
        .theme-panel .hint { color: var(--faint); font-size: 11.5px; line-height: 1.35; }

        /* Type colours */
        .t-Normal{background:#9a9a78}.t-Fire{background:#e0742e}.t-Water{background:#5b84e3}.t-Electric{background:#d8b322}
        .t-Grass{background:#5fae45}.t-Ice{background:#6fc2c0}.t-Fighting{background:#b8302a}.t-Poison{background:#9443a0}
        .t-Ground{background:#cfa94e}.t-Flying{background:#8e79e0}.t-Psychic{background:#e8527f}.t-Bug{background:#94a520}
        .t-Rock{background:#ad9535}.t-Ghost{background:#6a5594}.t-Dragon{background:#6236ee}.t-Dark{background:#6b5547}
        .t-Steel{background:#9a9ab8}.t-Unknown{background:#4a5552}
    </style>
</head>
<body>
<div id="stage">
    <!-- Controls. Empty parts of the bar drag the window. -->
    <div class="bar" id="bar" data-tauri-drag-region>
        <div class="seg" id="facilitySeg">
            <button data-v="tower">Tower</button>
            <button data-v="factory">Factory</button>
        </div>
        <div class="seg" id="formatSeg">
            <button data-v="singles">Singles</button>
            <button data-v="doubles">Doubles</button>
        </div>

        <div class="search" id="trainerBox">
            <input id="trainerInput" placeholder="NPC name, class or #" autocomplete="off" spellcheck="false">
            <ul class="results hidden" id="trainerResults" role="listbox"></ul>
        </div>

        <div id="factoryBox" class="hidden" style="display:flex;gap:8px;align-items:center">
            <div class="seg" id="levelSeg">
                <button data-v="50">Lv 50</button>
                <button data-v="100">Lv 100</button>
            </div>
            <div class="stepper">Round
                <button class="icon-btn" id="roundDown" title="Previous round">−</button>
                <b id="roundNum">1</b>
                <button class="icon-btn" id="roundUp" title="Next round">+</button>
            </div>
        </div>

        <span class="spacer" data-tauri-drag-region></span>
        <button class="icon-btn update hidden" id="updateBtn" title="A newer version is available">Update</button>
        <button class="icon-btn" id="clearBtn" title="Clear the picked Pokémon (Esc)">Clear</button>
        <button class="icon-btn" id="pickerBtn" title="Show or hide the Pokémon picker">Picker</button>
        <button class="icon-btn" id="teamBtn" title="Show or hide your team at the bottom">Team</button>
        <button class="icon-btn" id="themeBtn" title="Colours">Theme</button>
        <button class="icon-btn hidden" id="obsBtn" title="Copy the address for an OBS Browser Source">OBS</button>
        <button class="icon-btn" id="zoomOut" title="Smaller">A−</button>
        <button class="icon-btn" id="zoomIn" title="Larger">A+</button>
        <span id="appBtns" class="hidden" style="display:inline-flex;gap:4px">
            <button class="icon-btn" id="pinBtn" title="Keep on top of other windows">Pin</button>
            <button class="icon-btn" id="minBtn" title="Minimise">_</button>
            <button class="icon-btn" id="closeBtn" title="Close">✕</button>
        </span>
    </div>

    <div class="theme-panel hidden" id="themePanel">
        <h3>Theme</h3>
        <div class="presets" id="presets"></div>
        <div class="pick-row"><label for="accentPick">Accent colour</label><input type="color" id="accentPick"></div>
        <div class="pick-row"><label for="bgPick">Background colour</label><input type="color" id="bgPick"></div>
        <div class="pick-row"><label for="opacityPick">Stream panel opacity</label>
            <span style="display:flex;align-items:center;gap:6px"><input type="range" id="opacityPick" min="40" max="100" step="5"><span class="val" id="opacityVal"></span></span></div>
        <div class="hint">Opacity only affects the OBS view: lower it to let your stream background show through.</div>
    </div>

    <div class="head" id="head"></div>

    <div class="picker" id="picker">
        <div class="picker-top">
            <div class="search"><input id="monInput" placeholder="Add Pokémon…" autocomplete="off" spellcheck="false"></div>
            <span class="hint" id="pickerHint"></span>
        </div>
        <div class="chips" id="chips"></div>
    </div>

    <div class="slots" id="slots"><div class="status">Loading data…</div></div>
    <div class="team" id="team"></div>
    <div id="dialog"></div>
    <div class="note" id="note"></div>
    <div class="foot" id="foot"></div>
</div>

<script>
// ============================================================
// Setup
// ============================================================
const params = new URLSearchParams(location.search);
const DISPLAY = params.get('view') === 'display';   // OBS Browser Source: read-only copy of the app window
// OBS can show the opponent and your team as two separate sources (&part=opponent / &part=team), placed anywhere
const PART = DISPLAY ? (params.get('part') || 'all') : 'all';
const TAURI = DISPLAY ? null : (window.__TAURI__ || null);   // present inside the desktop app
const appWindow = TAURI ? TAURI.window.getCurrentWindow() : null;

// The site is the single source of data. Each successful download is cached, so the app
// still works offline; data/ holds a snapshot bundled at build time for a first offline start.
const SITE_DATA = 'https://pokefrontier.egpr.cloud/data/';
const RELEASES_API = 'https://api.github.com/repos/nthGP/pokefrontier-overlay/releases/latest';
// Gen 1-4 Pokémon use Diamond/Pearl sprites; Gen 5 ones (id > 493) use Black/White
const SPRITE = id => `https://veekun.com/dex/media/pokemon/main-sprites/${id > 493 ? 'black-white' : 'diamond-pearl'}/${id}.png`;

// Battle Tower: IVs are fixed by trainer number
const TOWER_TIERS = [[100, 9], [120, 12], [140, 15], [160, 18], [180, 21], [200, 25], [220, 28], [300, 31]];

// Battle Factory: which IV tiers each round draws from (facility_notes.md, "Reported")
const POOL3 = [18, 21, 25, 28, 31];
const FACTORY_ROUNDS = {
    50:  [[9, 12], [12], [15], [18], [21], [25], [25, 28], POOL3],
    100: [[18], [21], [25], [25, 28], POOL3, POOL3, POOL3, POOL3],
};
const FACTORY_MAX_ROUND = 8;   // round 8 means "8 and later"

let trainers = [], sets = [], dex = { moves: {}, species: {} }, idMap = {};
let setsBySpecies = new Map();

// ============================================================
// Themes: each is a background and an accent; every other colour is derived from them
// ============================================================
const PRESETS = {
    frontier: { name: 'Frontier', bg: '#0f1513', accent: '#4fc79b' },
    tower:    { name: 'Battle Tower', bg: '#1d1013', accent: '#e9a23b' },
    slate:    { name: 'Slate', bg: '#12161c', accent: '#7da7ff' },
    midnight: { name: 'Midnight', bg: '#15122a', accent: '#c3a6ff' },
    dex:      { name: 'Pokédex', bg: '#17171a', accent: '#f2555a' },
    paper:    { name: 'Paper', bg: '#eceae4', accent: '#2f6fd6' },
};
const DEFAULT_THEME = { preset: 'frontier', bg: PRESETS.frontier.bg, accent: PRESETS.frontier.accent, opacity: 92 };

const hexToRgb = h => { const n = parseInt(h.replace('#', ''), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbToHex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => rgbToHex(hexToRgb(a).map((v, i) => v + (hexToRgb(b)[i] - v) * t));
const luminance = h => {
    const [r, g, b] = hexToRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
};

function applyTheme(theme) {
    const t = { ...DEFAULT_THEME, ...(theme || {}) };
    const bg = t.bg, accent = t.accent;
    const dark = luminance(bg) < 0.4;
    // Text is tinted with the background's hue so the greys feel part of the palette
    const ink = dark ? mix(bg, '#ffffff', 0.9) : mix(bg, '#000000', 0.86);
    const step = x => mix(bg, ink, x);
    const [r, g, b] = hexToRgb(bg);
    const vars = {
        '--bg': bg,
        '--surface': step(0.05),
        '--surface-2': step(0.09),
        '--surface-3': step(0.13),
        '--line': step(0.15),
        '--line-strong': step(0.24),
        '--ink': ink,
        '--muted': step(0.62),
        '--faint': step(0.42),
        '--accent': accent,
        '--accent-soft': mix(bg, accent, 0.2),
        '--accent-ink': luminance(accent) > 0.35 ? mix(accent, '#000000', 0.85) : '#ffffff',
        '--warn': dark ? '#e6ad4c' : '#9a6200',
        '--danger': dark ? '#ef8a7e' : '#a3352b',
        '--shadow': dark ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.10)',
        '--panel': `rgba(${r}, ${g}, ${b}, ${t.opacity / 100})`,
        // Stat colours (the usual damage-calc ones), darker on light backgrounds
        '--ev-hp':  dark ? '#ff6b6b' : '#c62f2f',
        '--ev-atk': dark ? '#f5ac78' : '#c0611f',
        '--ev-def': dark ? '#fae078' : '#8f7400',
        '--ev-spa': dark ? '#9db7f5' : '#2f5fc4',
        '--ev-spd': dark ? '#a7db8d' : '#2f7d1f',
        '--ev-spe': dark ? '#fa92b2' : '#b8336a',
    };
    const root = document.documentElement.style;
    for (const [k, v] of Object.entries(vars)) root.setProperty(k, v);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
}

const DEFAULT_STATE = {
    facility: 'tower', format: 'singles',
    trainerId: null,
    level: 50, round: 1,
    picks: [],           // [{ species, locked: setId|null, revealed: [move names] }]
    showPicker: true, zoom: 1,
    showTeam: true,
    teams: [],             // saved Tower teams: [{ id, name, text }] (text in Showdown format)
    towerTeamId: null,
    factoryTeam: [],       // rentals: [{ species, set_id }]
    theme: { ...DEFAULT_THEME },
};
let state = loadState();

function loadState() {
    try {
        const saved = JSON.parse(localStorage.getItem('overlayState') || 'null');
        if (saved) return { ...DEFAULT_STATE, ...saved };
    } catch (e) {}
    return { ...DEFAULT_STATE };
}

const norm = s => String(s || '').toLowerCase().replace(/♀/g, 'f').replace(/♂/g, 'm').replace(/[^a-z0-9]/g, '');
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slotCount = () => state.format === 'doubles' ? 4 : 3;
const trainerNo = t => parseInt(t.id.split('_').pop(), 10);
const trainerIV = t => (TOWER_TIERS.find(([last]) => trainerNo(t) <= last) || [0, null])[1];
const currentTrainer = () => trainers.find(t => t.id === state.trainerId) || null;

// ============================================================
// Data
// ============================================================
const dataStatus = {};   // name -> 'live' | ISO date of the cached copy | 'bundled'

async function fetchWithTimeout(url, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
        const r = await fetch(url, { cache: 'no-cache', signal: ctrl.signal });
        if (!r.ok) throw new Error(`${r.status} ${url}`);
        return await r.json();
    } finally { clearTimeout(timer); }
}

async function loadJSON(name) {
    try {
        const data = await fetchWithTimeout(SITE_DATA + name, 8000);
        try { localStorage.setItem('cache:' + name, JSON.stringify({ at: new Date().toISOString(), data })); } catch (e) {}
        dataStatus[name] = 'live';
        return data;
    } catch (e) {
        console.warn(`Couldn't download ${name}:`, e.message);
    }
    try {
        const cached = JSON.parse(localStorage.getItem('cache:' + name) || 'null');
        if (cached) { dataStatus[name] = cached.at; return cached.data; }
    } catch (e) {}
    const r = await fetch('data/' + name);   // snapshot bundled with the app
    if (!r.ok) throw new Error(`No copy of ${name} available`);
    dataStatus[name] = 'bundled';
    return r.json();
}

async function init() {
    if (DISPLAY) document.body.classList.add('display');
    applyTheme(state.theme);
    applyChrome();
    try {
        [trainers, sets, dex, idMap] = await Promise.all([
            loadJSON('trainers.json'), loadJSON('sets.json'),
            loadJSON('dex.json').catch(() => dex),     // only colours; the app works without it
            fetch('pokemon-id-map.json').then(r => r.json()).catch(() => ({})),
        ]);
    } catch (e) {
        document.getElementById('slots').innerHTML = `<div class="status">Couldn't load the set data. Check your connection and restart the app.</div>`;
        console.error(e);
        return;
    }
    for (const s of sets) {
        if (!setsBySpecies.has(s.pokemon)) setsBySpecies.set(s.pokemon, []);
        setsBySpecies.get(s.pokemon).push(s);
    }
    for (const list of setsBySpecies.values()) list.sort((a, b) => a.set_id - b.set_id);
    trainers.sort((a, b) => trainerNo(a) - trainerNo(b));

    if (DISPLAY) {
        pollMirror();
        return;
    }
    wireControls();
    wireTheme();
    render();
    renderFoot();
    checkForUpdate();
    broadcast();
}

// ============================================================
// Which sets can the opponent's species be running?
// Returns [{ set } | { missing: setId } | { unidentified: true }]
// ============================================================
function candidates(species) {
    const all = setsBySpecies.get(species) || [];
    if (state.facility === 'factory') {
        const tiers = FACTORY_ROUNDS[state.level][Math.min(state.round, FACTORY_MAX_ROUND) - 1];
        return all.filter(s => tiers.includes(s.ivs)).map(set => ({ set }));
    }
    const t = currentTrainer();
    if (!t) return all.map(set => ({ set }));
    const entries = t.pokemon_pool.filter(e => e.pokemon === species);
    const ids = [...new Set(entries.flatMap(e => e.sets))].sort((a, b) => a - b);
    const out = ids.map(id => {
        const set = all.find(s => s.set_id === id);
        return set ? { set } : { missing: id };
    });
    // Some trainers carry only some of a species' 31 IV sets, and which ones isn't known yet.
    // Show every 31 IV set they could be (not already listed) so nothing has to be looked up elsewhere.
    const unknown = entries.filter(e => e.pool === '31iv' && e.sets.length === 0).length;
    if (unknown) {
        const possible = all.filter(s => s.ivs === 31 && !ids.includes(s.set_id));
        if (possible.length) possible.forEach(set => out.push({ set, possible: true }));
        else for (let i = 0; i < unknown; i++) out.push({ unidentified: true });
        out.partial = { carries: unknown, of: possible.length };
    }
    return out;
}

// Species the picker offers, with how many sets each has here
function pickerSpecies() {
    if (state.facility === 'factory') {
        const tiers = FACTORY_ROUNDS[state.level][Math.min(state.round, FACTORY_MAX_ROUND) - 1];
        const out = [];
        for (const [sp, list] of setsBySpecies) {
            const n = list.filter(s => tiers.includes(s.ivs)).length;
            if (n) out.push({ species: sp, n });
        }
        return out.sort((a, b) => a.species.localeCompare(b.species));
    }
    const t = currentTrainer();
    if (!t) return [];
    // The number on each chip is how many set tiles that Pokémon shows
    const species = [...new Set(t.pokemon_pool.map(e => e.pokemon))];
    return species.map(sp => ({ species: sp, n: candidates(sp).length })).sort((a, b) => a.species.localeCompare(b.species));
}

// ============================================================
// Rendering
// ============================================================
// Sprite number: the bundled map first, then the site's dex numbers (covers Gen 5 and anything new)
function spriteId(species) {
    return idMap[species] || (dex.nums || {})[norm(species)] || null;
}

function typeBadges(species) {
    const types = dex.species[norm(species)] || [];
    return types.map(t => `<span class="type t-${t}">${t}</span>`).join('');
}

// Main EV stats, each in its stat colour
function evLabel(evs) {
    if (!evs) return '';
    const names = { hp: 'HP', atk: 'ATK', def: 'DEF', spa: 'SPA', spd: 'SPD', spe: 'SPE' };
    const total = Object.values(evs).reduce((a, b) => a + (b || 0), 0);
    if (!total) return '<span class="unk">EVs ?</span>';
    return Object.entries(evs).filter(([, v]) => v >= 100)
        .map(([k, v]) => `<span class="st-${k}" title="${v} ${names[k]} EVs">${names[k]}</span>`).join('<span class="sep">/</span>');
}

// Item icons are bundled in items/, named like PokeAPI's (old Gen 5 spellings mapped)
const ITEM_FILE = { nevermeltice: 'never-melt-ice', silverpowder: 'silver-powder', twistedspoon: 'twisted-spoon', leek: 'stick' };
function itemIcon(item) {
    if (!item) return `<span class="item-icon unk-item" title="Item not scouted yet">?</span>`;
    // PokeMMO renames (from the site's dex.json, e.g. Assault Gear -> Assault Vest), then old spellings
    const file = (dex.items || {})[norm(item)] || ITEM_FILE[norm(item)] || item.trim().toLowerCase().replace(/'/g, '').replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    // No icon for this item yet: show its name instead
    return `<img class="item-icon" src="items/${file}.png" alt="${esc(item)}" title="${esc(item)}"
        onerror="this.replaceWith(Object.assign(document.createElement('span'), { className: 'item-name', textContent: this.alt }))">`;
}

// A set is "out" if it has 4 known moves and lacks a revealed one,
// "maybe" if a revealed move could still be in one of its unscouted slots.
function setFit(set, revealed) {
    if (!revealed.length) return '';
    const known = set.moves.filter(m => m && m.trim()).map(norm);
    const missing = revealed.filter(m => !known.includes(norm(m)));
    if (!missing.length) return '';
    return missing.length <= 4 - known.length ? 'maybe' : 'out';
}

function renderSet(c, pick, idx) {
    if (c.unidentified) {
        return `<div class="set ghost"><div class="no">31 IV set</div>Not identified yet</div>`;
    }
    if (c.missing) {
        return `<div class="set ghost"><div class="no">Set ${c.missing}</div>Not in the sheet yet</div>`;
    }
    const s = c.set;
    const cls = ['set'];
    if (c.possible) cls.push('possible');
    if (pick.locked === s.set_id) cls.push('locked');
    else if (pick.locked != null) cls.push('out');
    else { const fit = setFit(s, pick.revealed); if (fit) cls.push(fit); }

    const moves = [0, 1, 2, 3].map(i => {
        const m = (s.moves[i] || '').trim();
        if (!m) return `<span class="move blank">Unknown</span>`;
        const info = dex.moves[norm(m)];
        const type = info ? info[0] : 'Unknown';
        const rev = pick.revealed.some(r => norm(r) === norm(m)) ? ' revealed' : '';
        return `<button class="move t-${type}${rev}" data-move="${esc(m)}" data-slot="${idx}" title="${esc(m)} · ${type}${info && info[2] ? ' · ' + info[2] + ' BP' : ''}">${esc(m)}</button>`;
    }).join('');

    return `<div class="${cls.join(' ')}" data-set="${s.set_id}" data-slot="${idx}">
        <div class="set-top">${itemIcon(s.item)}<span class="no">${s.set_id}</span><span class="ev">${evLabel(s.evs)}</span></div>
        <div class="set-sub">
            <span class="${s.nature ? '' : 'unk'}">${esc(s.nature || 'Nature ?')}</span>
            <span class="${s.ability ? 'ab' : 'unk'}">${esc(s.ability || 'Ability ?')}</span>
        </div>
        <div class="moves">${moves}</div>
    </div>`;
}

function columnsFor(n) {
    if (n <= 4) return Math.max(n, 1);
    return Math.min(Math.ceil(n / 2), 6);
}

function renderSlot(pick, idx) {
    const cands = candidates(pick.species);
    const id = spriteId(pick.species);
    // "Carries 2 of these 8": the dashed tiles are the 31 IV sets it could be
    const partial = cands.partial && cands.partial.of
        ? `<div class="partial" title="This trainer has ${cands.partial.carries} of these ${cands.partial.of} sets; which ones isn't known yet">Carries ${cands.partial.carries} of the ${cands.partial.of} dashed sets</div>`
        : '';
    const tiles = cands.length
        ? cands.map(c => renderSet(c, pick, idx)).join('')
        : `<div class="set ghost">No sets for this Pokémon in this ${state.facility === 'factory' ? 'round' : 'pool'}</div>`;
    return `<div class="slot">
        <div class="mon">
            <button class="x" data-remove="${idx}" title="Remove">×</button>
            ${id ? `<img src="${SPRITE(id)}" alt="" onerror="this.remove()">` : ''}
            <div class="sp">${esc(pick.species)}</div>
            <div class="types">${typeBadges(pick.species)}</div>
            ${partial}
        </div>
        <div class="sets" style="grid-template-columns:repeat(${columnsFor(cands.length)},minmax(0,230px))">${tiles}</div>
    </div>`;
}

function renderHead() {
    const head = document.getElementById('head');
    head.classList.toggle('hidden', PART === 'team');
    if (state.facility === 'factory') {
        const r = Math.min(state.round, FACTORY_MAX_ROUND);
        const tiers = FACTORY_ROUNDS[state.level][r - 1];
        head.innerHTML = `<span class="label">Battle Factory</span>
            <span class="name">Lv ${state.level} · Round ${r === FACTORY_MAX_ROUND ? r + '+' : r}</span>
            <span class="meta">${state.format} · <b>${tiers.join(' / ')} IV</b></span>`;
        return;
    }
    const t = currentTrainer();
    head.innerHTML = t
        ? `<span class="label">Opponent</span><span class="name">${esc(t.name)}</span>
           <span class="meta">${esc(t.class)} · #${trainerNo(t)} · ${state.format} · <b>${trainerIV(t)} IV</b></span>`
        : `<span class="label">Battle Tower</span><span class="name">${DISPLAY ? '' : 'Pick an opponent'}</span>
           <span class="meta">${state.format}</span>`;
}

function renderPicker() {
    const box = document.getElementById('picker');
    box.classList.toggle('hidden', DISPLAY || !state.showPicker);
    if (DISPLAY) return;
    const chips = document.getElementById('chips');
    const hint = document.getElementById('pickerHint');
    if (state.facility === 'tower' && !currentTrainer()) {
        chips.innerHTML = `<div class="empty">Type the opponent's name above to see their pool.</div>`;
        hint.textContent = '';
        return;
    }
    const q = norm(document.getElementById('monInput').value);
    let list = pickerSpecies();
    const total = list.length;
    if (q) list = list.filter(x => norm(x.species).includes(q));
    // Factory pools are big: only show chips once you start typing, unless the pool is small
    const tooMany = state.facility === 'factory' && !q && list.length > 60;
    const picked = new Set(state.picks.map(p => p.species));
    hint.textContent = `${state.picks.length}/${slotCount()} picked · ${total} species${state.facility === 'tower' ? ' in pool' : ' this round'}`;
    chips.innerHTML = tooMany
        ? `<div class="empty">${total} species can appear this round. Type a name to find one.</div>`
        : list.map((x, i) => {
            const id = spriteId(x.species);
            return `<button class="chip${picked.has(x.species) ? ' picked' : ''}${q && i === 0 ? ' active' : ''}" data-species="${esc(x.species)}">
                ${id ? `<img src="${SPRITE(id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ''}
                ${esc(x.species)}<span class="n">${x.n}</span></button>`;
        }).join('') || `<div class="empty">No match.</div>`;
}

function renderSlots() {
    const box = document.getElementById('slots');
    const n = slotCount();
    let html = state.picks.slice(0, n).map(renderSlot).join('');
    if (!DISPLAY) for (let i = state.picks.length; i < n; i++) html += `<div class="slot blank">Slot ${i + 1}: pick a Pokémon</div>`;
    box.innerHTML = html;
    box.classList.toggle('hidden', PART === 'team');
}

function renderNote() {
    const note = document.getElementById('note');
    if (state.facility === 'factory') {
        note.textContent = 'Factory round → IV mapping is reported, not fully confirmed in-game (Lv 100 especially). Click a move to mark it revealed; click a set to lock it.';
    } else {
        note.textContent = currentTrainer()
            ? 'Set assignments come from the Emerald carry-over and are unconfirmed unless scouted. Click a move to mark it revealed; click a set to lock it.'
            : '';
    }
}

function render() {
    document.getElementById('bar').classList.toggle('hidden', DISPLAY);
    if (!DISPLAY) syncControls();
    renderHead();
    renderPicker();
    renderSlots();
    renderTeam();
    renderNote();
    applyZoom();
}

// ============================================================
// Controls
// ============================================================
function commit(changes) {
    Object.assign(state, changes || {});
    state.picks = state.picks.slice(0, slotCount());
    try { localStorage.setItem('overlayState', JSON.stringify(state)); } catch (e) {}
    render();
    broadcast();
}

function syncControls() {
    const setSeg = (id, v) => document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
    setSeg('facilitySeg', state.facility);
    setSeg('formatSeg', state.format);
    setSeg('levelSeg', state.level);
    document.getElementById('trainerBox').classList.toggle('hidden', state.facility !== 'tower');
    document.getElementById('factoryBox').classList.toggle('hidden', state.facility !== 'factory');
    document.getElementById('roundNum').textContent = state.round >= FACTORY_MAX_ROUND ? FACTORY_MAX_ROUND + '+' : state.round;
    document.getElementById('pickerBtn').classList.toggle('on', state.showPicker);
    document.getElementById('teamBtn').classList.toggle('on', state.showTeam);
    const t = currentTrainer();
    const input = document.getElementById('trainerInput');
    if (document.activeElement !== input) input.value = t ? `${t.name} #${trainerNo(t)}` : '';
}

function addPick(species) {
    const i = state.picks.findIndex(p => p.species === species);
    if (i >= 0) { state.picks.splice(i, 1); commit(); return; }   // clicking a picked chip removes it
    if (state.picks.length >= slotCount()) state.picks.shift();     // full: oldest drops off
    state.picks.push({ species, locked: null, revealed: [] });
    commit();
}

function wireSeg(id, key, conv = v => v) {
    document.getElementById(id).addEventListener('click', e => {
        const b = e.target.closest('button');
        if (b) commit({ [key]: conv(b.dataset.v) });
    });
}

function wireControls() {
    document.getElementById('facilitySeg').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (b && b.dataset.v !== state.facility) commit({ facility: b.dataset.v, picks: [] });
    });
    wireSeg('formatSeg', 'format');
    wireSeg('levelSeg', 'level', Number);
    document.getElementById('roundDown').onclick = () => commit({ round: Math.max(1, state.round - 1), picks: [] });
    document.getElementById('roundUp').onclick = () => commit({ round: Math.min(FACTORY_MAX_ROUND, state.round + 1), picks: [] });
    document.getElementById('clearBtn').onclick = () => commit({ picks: [] });
    document.getElementById('pickerBtn').onclick = () => commit({ showPicker: !state.showPicker });
    document.getElementById('teamBtn').onclick = () => commit({ showTeam: !state.showTeam });
    wireTeam();
    document.getElementById('zoomIn').onclick = () => commit({ zoom: Math.min(1.6, +(state.zoom + 0.1).toFixed(2)) });
    document.getElementById('zoomOut').onclick = () => commit({ zoom: Math.max(0.6, +(state.zoom - 0.1).toFixed(2)) });

    wireTrainerSearch();

    const monInput = document.getElementById('monInput');
    monInput.addEventListener('input', renderPicker);
    monInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            const first = document.querySelector('#chips .chip');
            if (first) { addPick(first.dataset.species); monInput.value = ''; renderPicker(); }
        }
    });

    document.getElementById('chips').addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (chip) addPick(chip.dataset.species);
    });

    document.getElementById('slots').addEventListener('click', e => {
        const rm = e.target.closest('[data-remove]');
        if (rm) { state.picks.splice(+rm.dataset.remove, 1); commit(); return; }
        const mv = e.target.closest('.move[data-move]');
        if (mv) {
            const pick = state.picks[+mv.dataset.slot];
            const m = mv.dataset.move;
            const i = pick.revealed.findIndex(r => norm(r) === norm(m));
            if (i >= 0) pick.revealed.splice(i, 1); else pick.revealed.push(m);
            commit();
            return;
        }
        const set = e.target.closest('.set[data-set]');
        if (set) {
            const pick = state.picks[+set.dataset.slot];
            const id = +set.dataset.set;
            pick.locked = pick.locked === id ? null : id;
            commit();
        }
    });

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !e.target.closest('input')) commit({ picks: [] });
        if (e.ctrlKey && (e.key === '=' || e.key === '+')) { e.preventDefault(); document.getElementById('zoomIn').click(); }
        if (e.ctrlKey && e.key === '-') { e.preventDefault(); document.getElementById('zoomOut').click(); }
    });
}

function wireTrainerSearch() {
    const input = document.getElementById('trainerInput');
    const list = document.getElementById('trainerResults');
    let matches = [], active = 0;

    function show() {
        const terms = input.value.toLowerCase().trim().split(/\s+/).filter(Boolean).map(t => t.replace(/^#/, ''));
        // Exact name first, then names starting with what's typed, then everything else that matches
        const first = terms[0] || '';
        const rank = t => {
            const name = t.name.toLowerCase();
            return name === first ? 0 : name.startsWith(first) ? 1 : 2;
        };
        matches = trainers.filter(t => {
            const hay = `${t.name} ${t.class} ${trainerNo(t)}`.toLowerCase();
            return terms.every(term => hay.includes(term));
        }).sort((a, b) => rank(a) - rank(b) || trainerNo(a) - trainerNo(b)).slice(0, 50);
        active = 0;
        list.innerHTML = matches.length
            ? matches.map((t, i) => `<li data-i="${i}" class="${i === active ? 'active' : ''}"><span>${esc(t.name)} <span class="num">${esc(t.class)}</span></span><span class="num">#${trainerNo(t)}</span></li>`).join('')
            : '<li class="none">No trainer matches</li>';
        list.classList.remove('hidden');
    }
    function pick(t) {
        list.classList.add('hidden');
        input.blur();
        commit({ trainerId: t.id, picks: [] });
        document.getElementById('monInput').focus();
    }
    function move(d) {
        const items = list.querySelectorAll('li[data-i]');
        if (!items.length) return;
        active = (active + d + items.length) % items.length;
        items.forEach((li, i) => li.classList.toggle('active', i === active));
        items[active].scrollIntoView({ block: 'nearest' });
    }

    input.addEventListener('focus', () => { input.select(); show(); });
    input.addEventListener('input', show);
    input.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
        else if (e.key === 'Enter' && matches[active]) { e.preventDefault(); pick(matches[active]); }
        else if (e.key === 'Escape') { list.classList.add('hidden'); input.blur(); syncControls(); }
    });
    list.addEventListener('mousedown', e => {
        const li = e.target.closest('li[data-i]');
        if (li) { e.preventDefault(); pick(matches[+li.dataset.i]); }
    });
    input.addEventListener('blur', () => setTimeout(() => { list.classList.add('hidden'); syncControls(); }, 100));
}

// ============================================================
// Your team: Tower teams are saved Showdown-format text; Factory rentals are sheet sets
// ============================================================
const STAT_KEYS = { hp: 'hp', atk: 'atk', def: 'def', spa: 'spa', spd: 'spd', spe: 'spe' };

// Reads the usual Showdown / PokePaste export
function parseShowdown(text) {
    const mons = [];
    for (const block of String(text || '').replace(/\r/g, '').split(/\n\s*\n/)) {
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
        if (!lines.length) continue;
        let [head, item] = lines[0].split(/\s+@\s+/);
        head = head.replace(/\s*\((M|F)\)\s*$/, '').trim();
        const named = head.match(/\(([^()]+)\)\s*$/);           // "Nickname (Species)"
        const mon = { species: (named ? named[1] : head).trim(), item: item ? item.trim() : null,
                      ability: null, nature: null, moves: [], evs: null };
        for (const l of lines.slice(1)) {
            if (l.startsWith('-')) mon.moves.push(l.replace(/^-\s*/, '').trim());
            else if (/^Ability:/i.test(l)) mon.ability = l.slice(l.indexOf(':') + 1).trim();
            else if (/\sNature$/i.test(l)) mon.nature = l.replace(/\s+Nature$/i, '').trim();
            else if (/^EVs:/i.test(l)) {
                mon.evs = { hp: 0, atk: 0, def: 0, spa: 0, spd: 0, spe: 0 };
                for (const part of l.slice(4).split('/')) {
                    const m = part.trim().match(/^(\d+)\s+(\w+)/);
                    if (m && STAT_KEYS[m[2].toLowerCase()]) mon.evs[STAT_KEYS[m[2].toLowerCase()]] = +m[1];
                }
            }
        }
        mon.moves = mon.moves.slice(0, 4);
        mons.push(mon);
    }
    return mons;
}

function currentTowerTeam() {
    return state.teams.find(t => t.id === state.towerTeamId) || null;
}

function resolveTeam() {
    if (DISPLAY) return state.myTeam || [];
    if (state.facility === 'factory') {
        return state.factoryTeam.slice(0, slotCount()).map(f => {
            const set = (setsBySpecies.get(f.species) || []).find(s => s.set_id === f.set_id);
            return set ? { species: set.pokemon, item: set.item, ability: set.ability, nature: set.nature,
                           moves: set.moves.filter(m => m && m.trim()), setId: set.set_id } : { species: f.species, moves: [] };
        });
    }
    const t = currentTowerTeam();
    return t ? parseShowdown(t.text).slice(0, slotCount()) : [];
}

function teamTitle() {
    if (DISPLAY) return state.teamName || '';
    if (state.facility === 'factory') return 'Rentals';
    const t = currentTowerTeam();
    return t ? t.name : '';
}

// One team member, drawn like an opponent's set tile
function memberCard(m, i) {
    const id = spriteId(m.species);
    const moves = [0, 1, 2, 3].map(k => {
        const mv = (m.moves[k] || '').trim();
        if (!mv) return `<span class="move blank">—</span>`;
        const info = dex.moves[norm(mv)];
        return `<span class="move t-${info ? info[0] : 'Unknown'}" title="${esc(mv)}">${esc(mv)}</span>`;
    }).join('');
    const click = !DISPLAY && state.facility === 'factory' ? ` click" data-rental="${i}" title="Click to swap this rental` : '';
    return `<div class="set tm${click}">
        <div class="set-top">
            <span class="tm-sprite">${id ? `<img class="mon-img" src="${SPRITE(id)}" alt="" onerror="this.remove()">` : ''}</span>
            ${itemIcon(m.item)}
            <span class="tm-name">${esc(m.species)}</span>
        </div>
        <div class="set-sub"><span class="${m.ability ? 'ab' : 'unk'}">${esc(m.ability || 'Ability ?')}</span></div>
        <div class="moves">${moves}</div>
    </div>`;
}

// Your team, laid out like an opponent's row: a label column, then one tile per Pokémon
function renderTeam() {
    const box = document.getElementById('team');
    const team = resolveTeam();
    const show = state.showTeam && PART !== 'opponent' && (!DISPLAY || team.length);
    box.classList.toggle('hidden', !show);
    if (!show) return;
    const n = slotCount();
    const factory = state.facility === 'factory';
    // Controls only in the app; OBS shows just the tiles
    let controls = '';
    if (!DISPLAY) {
        if (factory) controls = `<span class="tm-hint">Your rentals · click one to swap it</span>`;
        else {
            const opts = state.teams.map(t => `<option value="${esc(t.id)}"${t.id === state.towerTeamId ? ' selected' : ''}>${esc(t.name)}</option>`).join('');
            controls = `<span class="tm-hint">Your team</span>${state.teams.length ? `<select id="teamSelect" aria-label="Team">${opts}</select>` : ''}
                <button class="icon-btn" id="editTeams">${state.teams.length ? 'Edit teams' : 'Add a team'}</button>`;
        }
    }
    let cards = team.map(memberCard).join('');
    let cols = team.length;
    if (factory && !DISPLAY) for (let i = team.length; i < n; i++) { cards += `<div class="set tm empty" data-rental="${i}">+ Add rental</div>`; cols++; }
    if (!factory && !team.length) {
        cards = `<div class="empty-msg">No team yet. Click <b>Add a team</b> and paste it from Showdown, or type it in the same format.</div>`;
        cols = 1;
    }
    box.innerHTML = `${controls ? `<div class="tm-controls">${controls}</div>` : ''}
        <div class="sets" style="grid-template-columns:repeat(${Math.max(cols, 1)},minmax(0,230px))">${cards}</div>`;
}

// OBS addresses: one source with everything, or two sources placed separately
function openObsDialog(base) {
    const rows = [
        ['Everything', base, 'Opponent and your team in one source.'],
        ['Opponent only', base + '&part=opponent', 'Use with "Team only" to place them separately.'],
        ['Team only', base + '&part=team', 'Your team on its own, anywhere in your layout.'],
    ];
    document.getElementById('dialog').innerHTML = `<div class="dialog-back" id="dlgBack"><div class="dialog" role="dialog" aria-label="OBS" style="width:min(620px,100%)">
        <div class="row"><h2 class="grow">Show it in OBS</h2><button class="btn" id="dlgClose">Done</button></div>
        <div class="hint">In OBS: Sources → + → Browser, paste an address as the URL. Keep this app open while streaming. Add <b>&amp;scale=0.8</b> to an address to shrink it.</div>
        ${rows.map(([name, url, hint], i) => `<div style="display:grid;gap:4px">
            <div class="row"><b class="grow">${name}</b><button class="btn" data-copy="${i}">Copy</button></div>
            <input type="text" readonly value="${esc(url)}" id="obsUrl${i}">
            <div class="hint">${hint}</div></div>`).join('')}
    </div></div>`;
    const back = document.getElementById('dlgBack');
    back.addEventListener('mousedown', e => { if (e.target === back) closeDialog(); });
    document.getElementById('dlgClose').onclick = closeDialog;
    back.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
        const input = document.getElementById('obsUrl' + b.dataset.copy);
        try { await navigator.clipboard.writeText(input.value); b.textContent = 'Copied'; }
        catch (e) { input.select(); b.textContent = 'Press Ctrl+C'; }
        setTimeout(() => { b.textContent = 'Copy'; }, 2000);
    });
}

function closeDialog() { document.getElementById('dialog').innerHTML = ''; }

// ---- Tower: create, edit and pick saved teams ----
const TEAM_EXAMPLE = `Gliscor @ Toxic Orb
Ability: Poison Heal
EVs: 204 HP / 246 SpD / 60 Spe
Careful Nature
- Protect
- Substitute
- Toxic
- Earthquake`;

function openTeamEditor(teamId) {
    let current = state.teams.find(t => t.id === teamId) || state.teams[0] || null;
    const box = document.getElementById('dialog');
    function draw() {
        const parsed = current ? parseShowdown(current.text) : [];
        const unknown = parsed.filter(m => !dex.species[norm(m.species)]).map(m => m.species);
        const badMoves = parsed.flatMap(m => m.moves).filter(mv => !dex.moves[norm(mv)]);
        box.innerHTML = `<div class="dialog-back" id="dlgBack"><div class="dialog" role="dialog" aria-label="Your teams">
            <div class="row"><h2 class="grow">Your teams</h2><button class="btn" id="dlgClose">Done</button></div>
            <div class="editor">
                <div class="team-list">
                    ${state.teams.map(t => `<button data-team="${esc(t.id)}" class="${current && t.id === current.id ? 'on' : ''}">${esc(t.name)}</button>`).join('')}
                    <button id="newTeam">+ New team</button>
                </div>
                ${current ? `<div style="display:grid;gap:8px">
                    <input type="text" id="teamName" value="${esc(current.name)}" aria-label="Team name">
                    <textarea id="teamText" spellcheck="false" placeholder="${esc(TEAM_EXAMPLE)}">${esc(current.text)}</textarea>
                    <div class="hint">Paste the team from Showdown (Export) or type it in the same format: one Pokémon per block, a blank line between them.
                        ${parsed.length ? `Read ${parsed.length}: ${parsed.map(m => esc(m.species)).join(', ')}.` : ''}
                        The overlay shows the first ${slotCount()} in ${state.format}.</div>
                    ${unknown.length ? `<div class="warn">Not a Pokémon name: ${unknown.map(esc).join(', ')}</div>` : ''}
                    ${badMoves.length ? `<div class="warn">Not a move name: ${badMoves.map(esc).join(', ')}</div>` : ''}
                    <div class="row"><button class="btn primary" id="useTeam">Use this team</button><span class="grow"></span><button class="btn danger" id="delTeam">Delete team</button></div>
                </div>` : `<div class="hint">No teams yet. Click <b>+ New team</b>.</div>`}
            </div></div></div>`;
        const back = document.getElementById('dlgBack');
        back.addEventListener('mousedown', e => { if (e.target === back) { closeDialog(); render(); } });
        document.getElementById('dlgClose').onclick = () => { closeDialog(); render(); };
        document.getElementById('newTeam').onclick = () => {
            const t = { id: 't' + Date.now(), name: `Team ${state.teams.length + 1}`, text: '' };
            state.teams.push(t); current = t; commit({ towerTeamId: t.id }); draw();
            document.getElementById('teamText').focus();
        };
        box.querySelectorAll('[data-team]').forEach(b => b.onclick = () => { current = state.teams.find(t => t.id === b.dataset.team); draw(); });
        if (!current) return;
        document.getElementById('teamName').oninput = e => { current.name = e.target.value || 'Untitled team'; commit(); };
        document.getElementById('teamText').oninput = e => {
            current.text = e.target.value; commit();
            const pos = e.target.selectionStart; draw();
            const ta = document.getElementById('teamText'); ta.focus(); ta.setSelectionRange(pos, pos);
        };
        document.getElementById('useTeam').onclick = () => { commit({ towerTeamId: current.id }); closeDialog(); render(); };
        document.getElementById('delTeam').onclick = () => {
            state.teams = state.teams.filter(t => t !== current);
            if (state.towerTeamId === current.id) state.towerTeamId = state.teams[0] ? state.teams[0].id : null;
            current = state.teams[0] || null; commit(); draw();
        };
    }
    draw();
}

// ---- Factory: pick or swap a rental (any set; this round's tiers listed first) ----
function openRentalPicker(slot) {
    const box = document.getElementById('dialog');
    const existing = state.factoryTeam[slot];
    let species = existing ? existing.species : null;
    const tiers = FACTORY_ROUNDS[state.level][Math.min(state.round, FACTORY_MAX_ROUND) - 1];
    function draw() {
        const q = norm((document.getElementById('rentalSearch') || {}).value || '');
        const all = [...setsBySpecies.keys()].sort();
        const list = q ? all.filter(sp => norm(sp).includes(q)).slice(0, 40) : [];
        const setsHtml = species ? (setsBySpecies.get(species) || []).slice().sort((a, b) => tiers.includes(b.ivs) - tiers.includes(a.ivs) || a.set_id - b.set_id).map(s => `
            <button class="rental${tiers.includes(s.ivs) ? '' : ' other'}" data-set="${s.set_id}">
                <span class="no">${s.set_id}</span>
                <span class="line1">${itemIcon(s.item)}${esc(s.item || 'Item ?')} · ${esc(s.nature || 'Nature ?')} · <span style="color:var(--warn)">${esc(s.ability || 'Ability ?')}</span> · ${s.ivs} IV</span>
                <span class="line2">${s.moves.filter(Boolean).map(esc).join(' / ') || 'Moves unknown'}</span>
            </button>`).join('') : '';
        box.innerHTML = `<div class="dialog-back" id="dlgBack"><div class="dialog" role="dialog" aria-label="Rental">
            <div class="row"><h2 class="grow">${existing ? `Swap ${esc(existing.species)}` : 'Add a rental'}</h2>
                ${existing ? '<button class="btn danger" id="rmRental">Remove</button>' : ''}<button class="btn" id="dlgClose">Cancel</button></div>
            <input type="text" id="rentalSearch" placeholder="Type the Pokémon's name…" autocomplete="off" spellcheck="false" value="${esc((document.getElementById('rentalSearch') || {}).value || '')}">
            ${list.length ? `<div class="chips small">${list.map(sp => `<button class="chip${sp === species ? ' picked' : ''}" data-sp="${esc(sp)}">${spriteId(sp) ? `<img src="${SPRITE(spriteId(sp))}" alt="" onerror="this.style.visibility='hidden'">` : ''}${esc(sp)}</button>`).join('')}</div>` : ''}
            ${species ? `<div class="hint">${esc(species)}: pick the set you rented. Sets at this round's IVs (${tiers.join('/')}) come first.</div><div class="rental-list">${setsHtml}</div>` : '<div class="hint">Type a name, pick the Pokémon, then pick its set.</div>'}
        </div></div>`;
        const back = document.getElementById('dlgBack');
        back.addEventListener('mousedown', e => { if (e.target === back) closeDialog(); });
        document.getElementById('dlgClose').onclick = closeDialog;
        const input = document.getElementById('rentalSearch');
        input.oninput = () => { const pos = input.selectionStart; draw(); const i2 = document.getElementById('rentalSearch'); i2.focus(); i2.setSelectionRange(pos, pos); };
        input.onkeydown = e => { if (e.key === 'Enter' && list[0]) { species = list[0]; draw(); } };
        box.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { species = b.dataset.sp; draw(); });
        box.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
            state.factoryTeam[slot] = { species, set_id: +b.dataset.set };
            state.factoryTeam = state.factoryTeam.filter(Boolean);
            closeDialog(); commit();
        });
        const rm = document.getElementById('rmRental');
        if (rm) rm.onclick = () => { state.factoryTeam.splice(slot, 1); closeDialog(); commit(); };
        if (!species) input.focus();
    }
    draw();
}

function wireTeam() {
    document.getElementById('team').addEventListener('click', e => {
        if (e.target.closest('#editTeams')) return openTeamEditor(state.towerTeamId);
        const r = e.target.closest('[data-rental]');
        if (r) openRentalPicker(+r.dataset.rental);
    });
    document.getElementById('team').addEventListener('change', e => {
        if (e.target.id === 'teamSelect') commit({ towerTeamId: e.target.value });
    });
    // Esc closes an open dialog (and doesn't also clear the battle)
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && document.getElementById('dialog').innerHTML) { e.stopPropagation(); closeDialog(); render(); }
    }, true);
}

// ============================================================
// Theme panel
// ============================================================
function wireTheme() {
    const panel = document.getElementById('themePanel');
    const accent = document.getElementById('accentPick');
    const bg = document.getElementById('bgPick');
    const opacity = document.getElementById('opacityPick');

    function sync() {
        const t = state.theme;
        accent.value = t.accent; bg.value = t.bg; opacity.value = t.opacity;
        document.getElementById('opacityVal').textContent = t.opacity + '%';
        document.getElementById('presets').innerHTML = Object.entries(PRESETS).map(([id, p]) => `
            <button class="preset${t.preset === id ? ' on' : ''}" data-preset="${id}">
                <span class="sw" style="background:linear-gradient(135deg, ${p.bg} 50%, ${p.accent} 50%)"></span>${esc(p.name)}
            </button>`).join('') + `
            <button class="preset${t.preset === 'custom' ? ' on' : ''}" disabled style="cursor:default">
                <span class="sw" style="background:linear-gradient(135deg, ${t.bg} 50%, ${t.accent} 50%)"></span>Custom
            </button>`;
    }
    function setTheme(patch) {
        state.theme = { ...state.theme, ...patch };
        applyTheme(state.theme);
        commit();
        sync();
    }

    document.getElementById('themeBtn').onclick = e => {
        e.stopPropagation();
        panel.classList.toggle('hidden');
        document.getElementById('themeBtn').classList.toggle('on', !panel.classList.contains('hidden'));
        sync();
    };
    document.addEventListener('mousedown', e => {
        if (!panel.classList.contains('hidden') && !panel.contains(e.target) && e.target.id !== 'themeBtn') {
            panel.classList.add('hidden');
            document.getElementById('themeBtn').classList.remove('on');
        }
    });
    document.getElementById('presets').addEventListener('click', e => {
        const b = e.target.closest('[data-preset]');
        if (b) { const p = PRESETS[b.dataset.preset]; setTheme({ preset: b.dataset.preset, bg: p.bg, accent: p.accent }); }
    });
    accent.addEventListener('input', () => setTheme({ preset: 'custom', accent: accent.value }));
    bg.addEventListener('input', () => setTheme({ preset: 'custom', bg: bg.value }));
    opacity.addEventListener('input', () => setTheme({ opacity: +opacity.value }));
}

// ============================================================
// OBS: the app keeps a copy of what's on screen on a small local web page
// (http://127.0.0.1:7373/?view=display) that OBS shows as a Browser Source.
// ============================================================
const MIRROR_KEYS = ['facility', 'format', 'trainerId', 'level', 'round', 'picks', 'theme', 'showTeam'];

function broadcast() {
    if (!TAURI) return;
    const payload = Object.fromEntries(MIRROR_KEYS.map(k => [k, state[k]]));
    // OBS gets the team ready to draw, not the saved teams
    payload.myTeam = resolveTeam();
    payload.teamName = teamTitle();
    TAURI.core.invoke('set_overlay_state', { state: JSON.stringify(payload) }).catch(() => {});
}

// In OBS: ask the app for the current screen a few times a second
let mirrorVersion = -1;
async function pollMirror() {
    try {
        const r = await fetch('/state', { cache: 'no-store' });
        const j = await r.json();
        if (j.version !== mirrorVersion) {
            mirrorVersion = j.version;
            if (j.state) {
                Object.assign(state, j.state);
                applyTheme(state.theme);
                render();
            }
        }
    } catch (e) { /* app closed: keep the last picture */ }
    setTimeout(pollMirror, 250);
}

// ============================================================
// Footer: where the data came from
// ============================================================
function renderFoot() {
    const st = dataStatus['sets.json'];
    let text;
    if (st === 'live') text = 'Data: live from pokefrontier.egpr.cloud';
    else if (st === 'bundled') text = '<span class="warn">Offline: using the data bundled with the app</span>';
    else if (st) text = `<span class="warn">Offline: using data saved ${new Date(st).toLocaleString()}</span>`;
    else text = '';
    document.getElementById('foot').innerHTML = text;
}

// ============================================================
// Desktop app: window buttons, pin, update notice
// ============================================================
function applyChrome() {
    if (!appWindow) return;
    document.getElementById('appBtns').classList.remove('hidden');
    const pin = document.getElementById('pinBtn');
    let pinned = true;
    try { pinned = localStorage.getItem('pinned') !== 'false'; } catch (e) {}
    const setPin = on => {
        pinned = on;
        pin.classList.toggle('on', on);
        appWindow.setAlwaysOnTop(on).catch(console.error);
        try { localStorage.setItem('pinned', String(on)); } catch (e) {}
    };
    setPin(pinned);
    pin.onclick = () => setPin(!pinned);
    document.getElementById('minBtn').onclick = () => appWindow.minimize();
    const obs = document.getElementById('obsBtn');
    obs.classList.remove('hidden');
    obs.onclick = async () => {
        const url = await TAURI.core.invoke('obs_url').catch(() => null);
        if (!url) { obs.textContent = 'OBS off'; obs.title = "The OBS link couldn't start: ports 7373-7377 are all in use."; return; }
        openObsDialog(url);
    };
    document.getElementById('closeBtn').onclick = () => appWindow.close();
}

// Compare "1.2.10" style versions
function newer(a, b) {
    const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
    for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0);
    return false;
}

async function checkForUpdate() {
    if (!TAURI) return;
    try {
        const current = await TAURI.app.getVersion();
        const latest = await fetchWithTimeout(RELEASES_API, 8000);
        const tag = String(latest.tag_name || '').replace(/^v/, '');
        if (!tag || !newer(tag, current)) return;
        const btn = document.getElementById('updateBtn');
        btn.textContent = `Update ${tag}`;
        btn.title = `You have ${current}. Click to open the download page.`;
        btn.classList.remove('hidden');
        btn.onclick = () => TAURI.opener.openUrl(latest.html_url);
    } catch (e) {
        console.warn('Update check failed:', e.message);
    }
}
