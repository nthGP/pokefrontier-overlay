# Builds the Windows installer.
#
# - Every push and pull request: builds it and keeps the installer as a downloadable
#   artifact on the run (Actions tab -> the run -> Artifacts). Good for testing a change.
# - Publishing a release: Actions -> Build -> "Run workflow" -> tick "Publish a release" -> Run.
#   It builds main and publishes release v<version> (the version in src-tauri/tauri.conf.json)
#   with the installer. That release is what users download, and what the app's "Update" button
#   points to. Bump the version first: running it again for a version that's already released
#   just adds the new build to that release.
#   Pushing a tag like v0.2.0 does the same (the tag must match the version).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the version in tauri.conf.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Parser and debug-log checks (no dependencies)
      - run: node scripts/test.js

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A copy of the site's data goes inside the app, so it works even on a first offline start.
      # Normally the app downloads fresh data every time it opens.
      - name: Bundle a data snapshot
        shell: bash
        run: |
          mkdir -p src/data
          for f in trainers.json sets.json dex.json; do
            curl -fsS -o "src/data/$f" "https://pokefrontier.egpr.cloud/data/$f" || echo "::warning::Couldn't download $f"
          done
          ls -la src/data

      - run: npm install

      - name: Work out whether this run publishes a release
        id: release
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version $version in tauri.conf.json"
              exit 1
            fi
            tag="${GITHUB_REF_NAME}"
          elif [ "${{ inputs.release }}" = "true" ]; then
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none (build only)}"

      - name: Build (and publish the release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Frontier Overlay ${{ steps.release.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Download **Frontier.Overlay_*_x64-setup.exe** below and run it.
            Windows may say "Windows protected your PC" because the app isn't signed: click **More info** -> **Run anyway**.
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: FrontierOverlay-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
