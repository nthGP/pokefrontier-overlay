# Builds the Windows installer.
#
# - Every push and pull request: builds it and keeps the installer as a downloadable
#   artifact on the run (Actions tab -> the run -> Artifacts). Good for testing a change.
# - Pushing a tag like v0.2.0: also publishes a GitHub Release with the installer.
#   That release is what users download, and what the app's "Update" button points to.
#   The tag must match "version" in src-tauri/tauri.conf.json.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A copy of the site's data goes inside the app, so it works even on a first offline start.
      # Normally the app downloads fresh data every time it opens.
      - name: Bundle a data snapshot
        shell: bash
        run: |
          mkdir -p src/data
          for f in trainers.json sets.json dex.json; do
            curl -fsS -o "src/data/$f" "https://pokefrontier.egpr.cloud/data/$f" || echo "::warning::Couldn't download $f"
          done
          ls -la src/data

      - run: npm install

      - name: Check the release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version $version in tauri.conf.json"
            exit 1
          fi

      - name: Build (and publish the release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Frontier Overlay ${{ github.ref_name }}
          releaseBody: |
            Download **Frontier.Overlay_*_x64-setup.exe** below and run it.
            Windows may say "Windows protected your PC" because the app isn't signed: click **More info** -> **Run anyway**.
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: FrontierOverlay-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
